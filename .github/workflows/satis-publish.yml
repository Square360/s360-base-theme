name: Publish to Satis

# When a GitHub Release is published (by release.yml's semantic-release run, or by
# hand), trigger a SatisBoss rebuild and wait until the new version is live on
# packages.square360.com. The org-wide SATISBOSS_KEY secret authenticates the call.
on:
  release:
    types: [published]

jobs:
  satis_publish:
    uses: Square360/shared-workflows/.github/workflows/reusable-satis-publish.yml@latest  # v3.3.0
    with:
      # Satis indexes this module under the GitHub repo name (S360-Base-Theme),
      # which differs from composer.json's square360/s360_base_theme. Reconcile
      # later; for now verify against the name satis actually serves.
      verify_package: square360/s360_base_theme
      verify_version: ${{ github.event.release.tag_name }}
    secrets:
      SATISBOSS_KEY: ${{ secrets.SATISBOSS_KEY }}
