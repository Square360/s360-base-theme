name: Release

# On every push to master, analyse conventional-commit messages, bump the version,
# tag it (v-prefixed), update CHANGELOG.md, and publish a GitHub Release.
# The published Release fires satis-publish.yml, which rebuilds packages.square360.com.
on:
  push:
    branches:
      - master

jobs:
  semantic_release:
    uses: Square360/shared-workflows/.github/workflows/reusable-semantic-release.yml@5e76fb81fecfe11441fe2d75f24e486027c4d65d  # v3.3.0
    with:
      release_branches: '["master"]'
    secrets:
      CI_GH_TOKEN: ${{ secrets.CI_GH_TOKEN }}
